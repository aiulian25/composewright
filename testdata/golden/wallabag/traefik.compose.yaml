#  generated by composewright test
name: docker
services:
  docker:
    image: docker.io/wallabag/wallabag:latest
    restart: unless-stopped
    environment:
      SYMFONY__ENV__DOMAIN_NAME: "${SYMFONY__ENV__DOMAIN_NAME}"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.docker.rule: "Host(`docker.home.arpa`)"
      traefik.http.services.docker.loadbalancer.server.port: "80"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --user-agent healthcheck http://localhost/api/info || exit 1"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  traefik:
    external: true
