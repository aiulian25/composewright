#  generated by composewright test
name: wallabag
services:
  wallabag:
    image: docker.io/wallabag/wallabag:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      SYMFONY__ENV__DATABASE_DRIVER: "${SYMFONY__ENV__DATABASE_DRIVER}"
      SYMFONY__ENV__DATABASE_HOST: "${SYMFONY__ENV__DATABASE_HOST}"
      SYMFONY__ENV__DATABASE_PORT: "${SYMFONY__ENV__DATABASE_PORT}"
      SYMFONY__ENV__DATABASE_NAME: "${SYMFONY__ENV__DATABASE_NAME}"
      SYMFONY__ENV__DATABASE_USER: "${SYMFONY__ENV__DATABASE_USER}"
      SYMFONY__ENV__DATABASE_PASSWORD: "${SYMFONY__ENV__DATABASE_PASSWORD}"
      SYMFONY__ENV__DATABASE_CHARSET: "${SYMFONY__ENV__DATABASE_CHARSET}"
      SYMFONY__ENV__DATABASE_TABLE_PREFIX: "${SYMFONY__ENV__DATABASE_TABLE_PREFIX}"
      SYMFONY__ENV__MAILER_DSN: "${SYMFONY__ENV__MAILER_DSN}"
      SYMFONY__ENV__FROM_EMAIL: "${SYMFONY__ENV__FROM_EMAIL}"
      SYMFONY__ENV__DOMAIN_NAME: "${SYMFONY__ENV__DOMAIN_NAME}"
      SYMFONY__ENV__SERVER_NAME: "${SYMFONY__ENV__SERVER_NAME}"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.wallabag.rule: "Host(`wallabag.home.arpa`)"
      traefik.http.services.wallabag.loadbalancer.server.port: "80"
    volumes:
      - "images:/var/www/wallabag/web/assets/images"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --user-agent healthcheck http://localhost/api/info || exit 1"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  db:
    image: docker.io/library/mariadb:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - "data:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--innodb_initialized"]
      interval: 20s
      timeout: 3s
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  redis:
    image: docker.io/library/redis:alpine
    restart: unless-stopped
    volumes:
      - "redis-data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 3s
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  images: {}
  data: {}
  redis-data: {}
networks:
  traefik:
    external: true
