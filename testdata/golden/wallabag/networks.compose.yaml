#  generated by composewright test
name: docker
services:
  docker:
    image: docker.io/wallabag/wallabag:latest
    restart: unless-stopped
    environment:
      SYMFONY__ENV__DOMAIN_NAME: "${SYMFONY__ENV__DOMAIN_NAME}"
    # newt (tunnel): route docker.home.arpa to http://docker:80
    # cloudflared (tunnel): route docker.home.arpa to http://docker:80
    networks:
      - default
      - npm_default
      - newt
      - cloudflared
    expose: ["80"]
    ports:
      - "127.0.0.1:8080:80/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --user-agent healthcheck http://localhost/api/info || exit 1"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  npm_default:
    external: true
  newt:
    external: true
  cloudflared:
    external: true
