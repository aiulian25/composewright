#  generated by composewright test
name: paperless-ngx
services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - "/srv/docker/paperless-ngx/redisdata:/data"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    environment:
      PAPERLESS_REDIS: "${PAPERLESS_REDIS}"
      PAPERLESS_DBENGINE: "${PAPERLESS_DBENGINE}"
      PAPERLESS_SECRET_KEY: "${PAPERLESS_SECRET_KEY}"
    ports:
      - "127.0.0.1:8000:8000/tcp"
    volumes:
      - "/srv/docker/paperless-ngx/data:/usr/src/paperless/data"
      - "/srv/docker/paperless-ngx/media:/usr/src/paperless/media"
      - "/srv/docker/paperless-ngx/export:/usr/src/paperless/export"
      - "/srv/docker/paperless-ngx/consume:/usr/src/paperless/consume"
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "-L", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
