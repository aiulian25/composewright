#  generated by composewright test
name: docker
services:
  db:
    image: docker.io/library/postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - "/srv/docker/docker/db:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  app:
    image: docker.io/library/nextcloud:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "${POSTGRES_HOST}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:8080:80/tcp"
    volumes:
      - "/srv/docker/docker/nextcloud:/var/www/html"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  cron:
    image: docker.io/library/nextcloud:latest
    entrypoint: ["/cron.sh"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "/srv/docker/docker/nextcloud:/var/www/html"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
