#  generated by composewright test
name: freshrss
services:
  freshrss:
    image: docker.io/freshrss/freshrss:latest
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      CRON_MIN: "${CRON_MIN}"
      TRUSTED_PROXY: "${TRUSTED_PROXY}"
    # newt (tunnel): route freshrss.home.arpa to http://freshrss:80
    # cloudflared (tunnel): route freshrss.home.arpa to http://freshrss:80
    networks:
      - default
      - npm_default
      - newt
      - cloudflared
    expose: ["80"]
    ports:
      - "127.0.0.1:8080:80/tcp"
    volumes:
      - "data:/var/www/FreshRSS/data"
      - "extensions:/var/www/FreshRSS/extensions"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  data: {}
  extensions: {}
networks:
  npm_default:
    external: true
  newt:
    external: true
  cloudflared:
    external: true
