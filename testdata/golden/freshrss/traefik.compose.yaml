#  generated by composewright test
name: freshrss
services:
  freshrss:
    image: docker.io/freshrss/freshrss:latest
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      CRON_MIN: "${CRON_MIN}"
      TRUSTED_PROXY: "${TRUSTED_PROXY}"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.freshrss.rule: "Host(`freshrss.home.arpa`)"
      traefik.http.services.freshrss.loadbalancer.server.port: "80"
    volumes:
      - "data:/var/www/FreshRSS/data"
      - "extensions:/var/www/FreshRSS/extensions"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  data: {}
  extensions: {}
networks:
  traefik:
    external: true
