#  generated by composewright test
name: uptime-kuma
services:
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:2
    restart: unless-stopped
    # newt (tunnel): route uptime-kuma.home.arpa to http://uptime-kuma:3001
    # cloudflared (tunnel): route uptime-kuma.home.arpa to http://uptime-kuma:3001
    networks:
      - default
      - npm_default
      - newt
      - cloudflared
    expose: ["3001"]
    ports:
      - "127.0.0.1:3001:3001/tcp"
    volumes:
      - "data:/app/data"
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      start_period: 180s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  data: {}
networks:
  npm_default:
    external: true
  newt:
    external: true
  cloudflared:
    external: true
