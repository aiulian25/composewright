#  generated by composewright test
name: uptime-kuma
services:
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001/tcp"
    volumes:
      - "/srv/docker/uptime-kuma/data:/app/data"
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      start_period: 180s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
