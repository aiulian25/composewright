#  generated by composewright test
name: mealie
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    restart: unless-stopped
    environment:
      ALLOW_SIGNUP: "${ALLOW_SIGNUP}"
      LOG_LEVEL: "${LOG_LEVEL}"
      DB_ENGINE: "${DB_ENGINE}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_SERVER: "${POSTGRES_SERVER}"
      POSTGRES_PORT: "${POSTGRES_PORT}"
      POSTGRES_DB: "${POSTGRES_DB}"
    # newt (tunnel): route mealie.home.arpa to http://mealie:9000
    # cloudflared (tunnel): route mealie.home.arpa to http://mealie:9000
    networks:
      - default
      - npm_default
      - newt
      - cloudflared
    expose: ["9000"]
    ports:
      - "127.0.0.1:9091:9000/tcp"
    volumes:
      - "mealie-data:/app/data"
    healthcheck:
      test: ["CMD-SHELL", "$$MEALIE_HOME/healthcheck.sh"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  mealie-data: {}
networks:
  npm_default:
    external: true
  newt:
    external: true
  cloudflared:
    external: true
