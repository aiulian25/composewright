#  generated by composewright test
name: mealie
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    restart: unless-stopped
    environment:
      ALLOW_SIGNUP: "${ALLOW_SIGNUP}"
      LOG_LEVEL: "${LOG_LEVEL}"
      DB_ENGINE: "${DB_ENGINE}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_SERVER: "${POSTGRES_SERVER}"
      POSTGRES_PORT: "${POSTGRES_PORT}"
      POSTGRES_DB: "${POSTGRES_DB}"
      # optional settings the upstream documents: set them in .env
      ALLOWED_IFRAME_HOSTS:
      ALLOW_PASSWORD_LOGIN:
      API_DOCS:
      API_PORT:
      BASE_URL:
      DAILY_SCHEDULE_TIME:
      DEFAULT_GROUP:
      DEFAULT_HOUSEHOLD:
      GLOBAL_MIDDLEWARE:
      HTTP_ALLOW_LIST:
      HTTP_DISALLOW_LIST:
      LDAP_ADMIN_FILTER:
      LDAP_AUTH_ENABLED:
      LDAP_BASE_DN:
      LDAP_ENABLE_STARTTLS:
      LDAP_ID_ATTRIBUTE:
      LDAP_MAIL_ATTRIBUTE:
      LDAP_NAME_ATTRIBUTE:
      LDAP_QUERY_BIND:
      LDAP_TLS_CACERTFILE:
      LDAP_TLS_INSECURE:
      LDAP_USER_FILTER:
      LOG_CONFIG_OVERRIDE:
      OIDC_ADMIN_GROUP:
      OIDC_AUTH_ENABLED:
      OIDC_AUTO_REDIRECT:
      OIDC_CLIENT_TIMEOUT:
      OIDC_GROUPS_CLAIM:
      OIDC_NAME_CLAIM:
      OIDC_PROVIDER_NAME:
      OIDC_REMEMBER_ME:
      OIDC_SCOPES_OVERRIDE:
      OIDC_SIGNING_ALGORITHM:
      OIDC_SIGNUP_ENABLED:
      OIDC_TLS_CACERTFILE:
      OIDC_USER_CLAIM:
      OIDC_USER_GROUP:
      SCRAPER_FLARESOLVERR_TIMEOUT:
      SCRAPER_FLARESOLVERR_URL:
      SCRAPER_PROXY_MODE:
      SCRAPER_PROXY_URL:
      SECURITY_MAX_LOGIN_ATTEMPTS:
      SECURITY_USER_LOCKOUT_TIME:
      SMTP_AUTH_STRATEGY:
      SMTP_FROM_EMAIL:
      SMTP_FROM_NAME:
      SQLITE_MIGRATE_JOURNAL_WAL:
      THEME_DARK_ACCENT:
      THEME_DARK_ERROR:
      THEME_DARK_INFO:
      THEME_DARK_PRIMARY:
      THEME_DARK_SECONDARY:
      THEME_DARK_SUCCESS:
      THEME_DARK_WARNING:
      THEME_LIGHT_ACCENT:
      THEME_LIGHT_ERROR:
      THEME_LIGHT_INFO:
      THEME_LIGHT_PRIMARY:
      THEME_LIGHT_SECONDARY:
      THEME_LIGHT_SUCCESS:
      THEME_LIGHT_WARNING:
      TLS_CERTIFICATE_PATH:
      TLS_PRIVATE_KEY_PATH:
      TOKEN_TIME:
      UVICORN_WORKERS:
      YTDLP_COOKIEFILE:
    # newt (tunnel): route mealie.home.arpa to http://mealie:9000
    # cloudflared (tunnel): route mealie.home.arpa to http://mealie:9000
    networks:
      - default
      - npm_default
      - newt
      - cloudflared
    expose: ["9000"]
    ports:
      - "127.0.0.1:9091:9000/tcp"
    volumes:
      - "mealie-data:/app/data"
    healthcheck:
      test: ["CMD-SHELL", "$$MEALIE_HOME/healthcheck.sh"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  mealie-data: {}
networks:
  npm_default:
    external: true
  newt:
    external: true
  cloudflared:
    external: true
