#  generated by composewright test
name: navidrome
services:
  navidrome:
    image: docker.io/deluan/navidrome:latest
    restart: unless-stopped
    # newt (tunnel): route navidrome.home.arpa to http://navidrome:4533
    # cloudflared (tunnel): route navidrome.home.arpa to http://navidrome:4533
    networks:
      - default
      - npm_default
      - newt
      - cloudflared
    expose: ["4533"]
    ports:
      - "127.0.0.1:4533:4533/tcp"
    volumes:
      - "navidrome_data:/data"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  navidrome_data: {}
networks:
  npm_default:
    external: true
  newt:
    external: true
  cloudflared:
    external: true
