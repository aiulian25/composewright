#  generated by composewright test
name: navidrome
services:
  navidrome:
    image: docker.io/deluan/navidrome:latest
    restart: unless-stopped
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.navidrome.rule: "Host(`navidrome.home.arpa`)"
      traefik.http.services.navidrome.loadbalancer.server.port: "4533"
    volumes:
      - "navidrome_data:/data"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  navidrome_data: {}
networks:
  traefik:
    external: true
