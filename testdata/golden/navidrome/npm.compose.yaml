#  generated by composewright test
name: navidrome
services:
  navidrome:
    image: docker.io/deluan/navidrome:latest
    restart: unless-stopped
    networks:
      - default
      - npm_default
    expose: ["4533"]
    volumes:
      - "navidrome_data:/data"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  navidrome_data: {}
networks:
  npm_default:
    external: true
