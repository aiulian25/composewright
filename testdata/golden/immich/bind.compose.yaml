#  generated by composewright test
name: immich-server
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3
    restart: unless-stopped
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_DATABASE_NAME: "${DB_DATABASE_NAME}"
    ports:
      - "127.0.0.1:2283:2283/tcp"
    volumes:
      - "/srv/docker/immich-server/library:/data"
    healthcheck:
      test: ["CMD-SHELL", "immich-healthcheck"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3
    restart: unless-stopped
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_DATABASE_NAME: "${DB_DATABASE_NAME}"
    volumes:
      - "/srv/docker/immich-server/model-cache:/cache"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    restart: unless-stopped
    volumes:
      - "/srv/docker/immich-server/redis-data:/data"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_DB: "${DB_DATABASE_NAME}"
      POSTGRES_INITDB_ARGS: "${POSTGRES_INITDB_ARGS}"
    volumes:
      - "/srv/docker/immich-server/postgres:/var/lib/postgresql/data"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
