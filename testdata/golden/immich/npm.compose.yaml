#  generated by composewright test
name: immich-server
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3
    restart: unless-stopped
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_DATABASE_NAME: "${DB_DATABASE_NAME}"
      # optional settings the upstream documents: set them in .env
      CLOUDFLARE_ACCOUNT_ID:
      CLOUDFLARE_API_TOKEN:
      CPU_CORES:
      DB_DATA_LOCATION:
      DB_HOSTNAME:
      DB_PORT:
      DB_SKIP_MIGRATIONS:
      DB_SSL_MODE:
      DB_STORAGE_TYPE:
      DB_URL:
      IMMICH_ALLOW_SETUP:
      IMMICH_API_METRICS_PORT:
      IMMICH_CONFIG_FILE:
      IMMICH_ENV:
      IMMICH_HELMET_FILE:
      IMMICH_HOST:
      IMMICH_IGNORE_MOUNT_CHECK_ERRORS:
      IMMICH_LOG_FORMAT:
      IMMICH_LOG_LEVEL:
      IMMICH_MEDIA_LOCATION:
      IMMICH_MICROSERVICES_METRICS_PORT:
      IMMICH_PORT:
      IMMICH_PROCESS_INVALID_IMAGES:
      IMMICH_TELEMETRY_EXCLUDE:
      IMMICH_TELEMETRY_INCLUDE:
      IMMICH_TRUSTED_PROXIES:
      IMMICH_VERSION:
      IMMICH_WORKERS_EXCLUDE:
      IMMICH_WORKERS_INCLUDE:
      MACHINE_LEARNING_ANN:
      MACHINE_LEARNING_ANN_FP16_TURBO:
      MACHINE_LEARNING_ANN_TUNING_LEVEL:
      MACHINE_LEARNING_CACHE_FOLDER:
      MACHINE_LEARNING_MODEL_ARENA:
      MACHINE_LEARNING_MODEL_INTER_OP_THREADS:
      MACHINE_LEARNING_MODEL_INTRA_OP_THREADS:
      MACHINE_LEARNING_MODEL_REVISION:
      MACHINE_LEARNING_MODEL_TTL:
      MACHINE_LEARNING_MODEL_TTL_POLL_S:
      MACHINE_LEARNING_RKNN:
      MACHINE_LEARNING_RKNN_THREADS:
      MACHINE_LEARNING_WORKER_TIMEOUT:
      NO_COLOR:
      REDIS_DBINDEX:
      REDIS_HOSTNAME:
      REDIS_PASSWORD:
      REDIS_PORT:
      REDIS_SOCKET:
      REDIS_URL:
      REDIS_USERNAME:
      TF_STATE_POSTGRES_CONN_STR:
      TF_VAR_env:
      TZ:
      UPLOAD_LOCATION:
    networks:
      - default
      - npm_default
    expose: ["2283"]
    volumes:
      - "library:/data"
    healthcheck:
      test: ["CMD-SHELL", "immich-healthcheck"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3
    restart: unless-stopped
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_DATABASE_NAME: "${DB_DATABASE_NAME}"
    volumes:
      - "model-cache:/cache"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    restart: unless-stopped
    volumes:
      - "redis-data:/data"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_DB: "${DB_DATABASE_NAME}"
      POSTGRES_INITDB_ARGS: "${POSTGRES_INITDB_ARGS}"
    volumes:
      - "postgres:/var/lib/postgresql/data"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  library: {}
  model-cache: {}
  redis-data: {}
  postgres: {}
networks:
  npm_default:
    external: true
