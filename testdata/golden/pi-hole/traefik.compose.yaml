#  generated by composewright test
name: docker-pi-hole
services:
  docker-pi-hole:
    image: docker.io/pihole/pihole:latest
    restart: unless-stopped
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.docker-pi-hole.rule: "Host(`docker-pi-hole.home.arpa`)"
      traefik.http.services.docker-pi-hole.loadbalancer.server.port: "53"
    healthcheck:
      test: ["CMD-SHELL", "dig -p $$(pihole-FTL --config dns.port) +short +norecurse +retry=0 @127.0.0.1 pi.hole || exit 1"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  traefik:
    external: true
