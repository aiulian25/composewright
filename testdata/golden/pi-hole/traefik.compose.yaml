#  generated by composewright test
name: pihole
services:
  pihole:
    image: docker.io/pihole/pihole:latest
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      FTLCONF_webserver_api_password: "${FTLCONF_webserver_api_password}"
      FTLCONF_dns_listeningMode: "${FTLCONF_dns_listeningMode}"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.pihole.rule: "Host(`pihole.home.arpa`)"
      traefik.http.services.pihole.loadbalancer.server.port: "53"
    volumes:
      - "etc-pihole:/etc/pihole"
    healthcheck:
      test: ["CMD-SHELL", "dig -p $$(pihole-FTL --config dns.port) +short +norecurse +retry=0 @127.0.0.1 pi.hole || exit 1"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  etc-pihole: {}
networks:
  traefik:
    external: true
