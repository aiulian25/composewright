#  generated by composewright test
name: pihole
services:
  pihole:
    image: docker.io/pihole/pihole:latest
    restart: unless-stopped
    environment:
      TZ: "${TZ}"
      FTLCONF_webserver_api_password: "${FTLCONF_webserver_api_password}"
      FTLCONF_dns_listeningMode: "${FTLCONF_dns_listeningMode}"
    # newt (tunnel): route pihole.home.arpa to http://pihole:53
    # cloudflared (tunnel): route pihole.home.arpa to http://pihole:53
    networks:
      - default
      - npm_default
      - newt
      - cloudflared
    expose: ["53"]
    ports:
      - "127.0.0.1:8053:53/tcp"
      - "127.0.0.1:8053:53/udp"
      - "127.0.0.1:8080:80/tcp"
      - "127.0.0.1:8443:443/tcp"
    volumes:
      - "etc-pihole:/etc/pihole"
    healthcheck:
      test: ["CMD-SHELL", "dig -p $$(pihole-FTL --config dns.port) +short +norecurse +retry=0 @127.0.0.1 pi.hole || exit 1"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  etc-pihole: {}
networks:
  npm_default:
    external: true
  newt:
    external: true
  cloudflared:
    external: true
