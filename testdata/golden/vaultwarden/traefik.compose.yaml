#  generated by composewright test
name: vaultwarden
services:
  vaultwarden:
    image: ghcr.io/dani-garcia/vaultwarden:latest
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN}"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.vaultwarden.rule: "Host(`vaultwarden.home.arpa`)"
      traefik.http.services.vaultwarden.loadbalancer.server.port: "80"
    volumes:
      - "data:/data"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  data: {}
networks:
  traefik:
    external: true
