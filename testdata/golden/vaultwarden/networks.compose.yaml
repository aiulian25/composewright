#  generated by composewright test
name: vaultwarden
services:
  vaultwarden:
    image: ghcr.io/dani-garcia/vaultwarden:latest
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN}"
    # newt (tunnel): route vaultwarden.home.arpa to http://vaultwarden:80
    # cloudflared (tunnel): route vaultwarden.home.arpa to http://vaultwarden:80
    networks:
      - default
      - npm_default
      - newt
      - cloudflared
    expose: ["80"]
    ports:
      - "127.0.0.1:8000:80/tcp"
    volumes:
      - "data:/data"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  data: {}
networks:
  npm_default:
    external: true
  newt:
    external: true
  cloudflared:
    external: true
