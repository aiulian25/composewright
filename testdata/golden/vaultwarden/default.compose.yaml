#  generated by composewright test
name: vaultwarden
services:
  vaultwarden:
    image: ghcr.io/dani-garcia/vaultwarden:latest
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN}"
    ports:
      - "127.0.0.1:8000:80/tcp"
    volumes:
      - "data:/data"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  data: {}
