#  generated by composewright test
name: actual-server
services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5006:5006/tcp"
    volumes:
      - "actual-data:/data"
    healthcheck:
      test: ["CMD-SHELL", "node scripts/health-check.js"]
      interval: 1m0s
      timeout: 10s
      start_period: 20s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  actual-data: {}
