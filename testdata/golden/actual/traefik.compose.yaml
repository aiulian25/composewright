#  generated by composewright test
name: actual-server
services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    restart: unless-stopped
    environment:
      # optional settings the upstream documents: set them in .env
      ACTUAL_CACHE_TTL:
      ACTUAL_DATA_DIR:
      ACTUAL_ENCRYPTION_PASSWORD:
      ACTUAL_LOCK_TIMEOUT:
      ACTUAL_NO_LOCK:
      ACTUAL_PASSWORD:
      ACTUAL_SERVER_URL:
      ACTUAL_SESSION_TOKEN:
      ACTUAL_SYNC_ID:
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.actual-server.rule: "Host(`actual-server.home.arpa`)"
      traefik.http.services.actual-server.loadbalancer.server.port: "5006"
    volumes:
      - "actual-data:/data"
    healthcheck:
      test: ["CMD-SHELL", "node scripts/health-check.js"]
      interval: 1m0s
      timeout: 10s
      start_period: 20s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  actual-data: {}
networks:
  traefik:
    external: true
