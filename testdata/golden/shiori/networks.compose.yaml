#  generated by composewright test
name: shiori
services:
  shiori:
    image: ghcr.io/go-shiori/shiori:latest
    restart: unless-stopped
    # newt (tunnel): route shiori.home.arpa to http://shiori:8080
    # cloudflared (tunnel): route shiori.home.arpa to http://shiori:8080
    networks:
      - default
      - npm_default
      - newt
      - cloudflared
    expose: ["8080"]
    ports:
      - "127.0.0.1:8080:8080/tcp"
    volumes:
      - "shiori:/shiori"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  shiori: {}
networks:
  npm_default:
    external: true
  newt:
    external: true
  cloudflared:
    external: true
