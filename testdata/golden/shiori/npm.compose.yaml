#  generated by composewright test
name: shiori
services:
  shiori:
    image: ghcr.io/go-shiori/shiori:latest
    restart: unless-stopped
    networks:
      - default
      - npm_default
    expose: ["8080"]
    volumes:
      - "shiori:/shiori"
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: "1"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  shiori: {}
networks:
  npm_default:
    external: true
