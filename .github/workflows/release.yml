name: release

# Dispatch manually on an existing vMAJOR.MINOR.PATCH tag. Candidate jobs
# have no registry write credentials. Publication copies their tested and
# scanned OCI archives, preserving digests, SBOM and provenance; no rebuild.
on:
  workflow_dispatch:
    inputs:
      candidate_only:
        description: Build and test candidates without publishing
        type: boolean
        default: false
      candidate_version:
        description: Version for candidate-only builds (empty uses tag or dev)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: lint, test, build and source vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Validate candidate-only version override
        env:
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          if [ -n "$CANDIDATE_VERSION" ]; then
            [ "$CANDIDATE_ONLY" = true ]
            [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - run: make lint test build
      - run: make vuln
      - name: Enable network namespace isolation on this disposable runner
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: make egress offline

  candidate:
    uses: ./.github/workflows/candidate.yml
    with:
      version: ${{ inputs.candidate_version }}

  image:
    if: ${{ !inputs.candidate_only }}
    needs: [test, candidate]
    runs-on: ubuntu-latest
    # Only this job writes: the release, the image on GHCR and its signature.
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a version tag
        run: '[[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: candidate-*
          path: candidates
      - run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse a version that is published already
        run: |
          image="ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "$image exists already; a published version is never overwritten" >&2
            exit 1
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: publish
        name: Publish tested archives and assemble the release index
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            folder="candidates/candidate-$arch"
            # The checksum file uses the original candidate job's relative path.
            (cd "$folder"; sed 's|evidence/||' candidate.tar.sha256 | sha256sum --check --strict)
          done
          printf '%s' "$GH_TOKEN" | skopeo login --username "$REGISTRY_USER" --password-stdin ghcr.io
          for arch in amd64 arm64; do
            folder="candidates/candidate-$arch"
            skopeo copy --all --preserve-digests "oci-archive:$folder/candidate.tar" "docker://$IMAGE:$VERSION-$arch"
            skopeo inspect --raw "docker://$IMAGE:$VERSION-$arch" > "$folder/published-index.json"
            cmp "$folder/index.json" "$folder/published-index.json"
            digest="sha256:$(sha256sum "$folder/index.json" | cut -d ' ' -f 1)"
            sources+=("$IMAGE@$digest")
          done
          tags=()
          while IFS= read -r tag; do [ -z "$tag" ] || tags+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}"
      - run: |
          for arch in amd64 arm64; do
            cp "candidates/candidate-$arch/vulnerabilities.json" "vulnerabilities-$arch.json"
            cp "candidates/candidate-$arch/sbom.cdx.json" "sbom-$arch.cdx.json"
          done
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes vulnerabilities-*.json sbom-*.cdx.json
        env:
          GH_TOKEN: ${{ github.token }}
