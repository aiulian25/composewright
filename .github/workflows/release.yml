name: release

# Releases are published from a local build that was scanned before it was
# pushed, so a version tag publishes nothing here. Started by hand on a tag,
# this runs CI's checks, builds the image for amd64 and arm64 with buildx,
# pushes it to GHCR with its SBOM and provenance, signs it with cosign
# (keyless) and creates the GitHub release; it refuses a version GHCR has
# already, since a published version is never overwritten.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint, test, build, vulnerabilities and image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - run: make lint test build
      - run: make vuln
      - run: make container-smoke

  image:
    needs: test
    runs-on: ubuntu-latest
    # Only this job writes: the release, the image on GHCR and its signature.
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: build-info
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse a version that is published already
        run: |
          image="ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "$image exists already; a published version is never overwritten" >&2
            exit 1
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.build-info.outputs.commit }}
            DATE=${{ steps.build-info.outputs.date }}
      - run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
